<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Cómo usar RecyTrack</title>
  <meta name="theme-color" content="#2B1424">
  <link rel="icon" href="/icons/icon-192.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Gloock&family=Hanken+Grotesk:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { min-height: 100vh; background: #2B1424; color: #F6EFF3; font-family: 'Hanken Grotesk', system-ui, sans-serif; }
    main { max-width: 760px; margin: 0 auto; padding: 28px 18px 40px; }
    .marca { display: flex; align-items: center; gap: 10px; font-family: Gloock, serif; font-size: 24px; }
    .marca img { width: 34px; height: 34px; border-radius: 9px; }
    .etiqueta { display: inline-block; margin-top: 26px; padding: 6px 14px; border-radius: 999px; background: rgba(169, 201, 143, .16); color: #CFE3BE; font-size: 13px; font-weight: 700; letter-spacing: 1.5px; }
    h1 { font-family: Gloock, serif; font-weight: 400; font-size: clamp(32px, 8vw, 46px); line-height: 1.05; margin-top: 12px; }
    p { color: #DCCDD6; font-size: 17px; line-height: 1.5; margin-top: 10px; }
    video { width: 100%; margin-top: 22px; border-radius: 16px; background: #000; box-shadow: 0 18px 40px rgba(0, 0, 0, .45); }
    .botones { display: flex; flex-direction: column; gap: 12px; margin-top: 24px; }
    a.boton { display: block; text-align: center; text-decoration: none; padding: 16px; border-radius: 14px; font-weight: 700; font-size: 17px; }
    .principal { background: #8DB574; color: #2B1424; }
    .secundario { border: 1.5px solid rgba(220, 205, 214, .45); color: #F6EFF3; }
    footer { margin-top: 30px; font-size: 13px; color: #9A8191; text-align: center; }
  </style>
</head>
<body>
  <main>
    <div class="marca"><img src="/icons/icon-192.png" alt="">RecyTrack</div>
    <span class="etiqueta">TUTORIAL · 3 MINUTOS</span>
    <h1>Cómo reciclar con RecyTrack</h1>
    <p>Escaneas el QR del contenedor, eliges el tamaño de la bolsa y listo. Mira cómo se hace.</p>
    <video controls playsinline preload="metadata" poster="portada.jpg">
      <source src="colaborador.mp4" type="video/mp4">
    </video>
    <div class="botones">
      <a class="boton principal" href="/">Abrir RecyTrack</a>
      <a class="boton secundario" href="/instalar/">Cómo instalarla en tu celular</a>
    </div>
    <footer>Piloto en las oficinas de Viñedos Familia Chadwick · Proyecto de título Duoc UC</footer>
  </main>
</body>
</html>
