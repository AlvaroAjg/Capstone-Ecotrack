<text x="670.0" y="102.0" font-family="DejaVu Sans" font-size="13.5" font-weight="bold" font-style="normal" text-anchor="middle" fill="#1F2D24">Sistema RecyTrack</text>
<text x="400.0" y="139.5" font-family="DejaVu Sans" font-size="12" font-weight="normal" font-style="normal" text-anchor="middle" fill="#1F2D24">Registrar cuenta</text>
<text x="400.0" y="201.5" font-family="DejaVu Sans" font-size="12" font-weight="normal" font-style="normal" text-anchor="middle" fill="#1F2D24">Iniciar sesión</text>
<text x="400.0" y="256.0" font-family="DejaVu Sans" font-size="12" font-weight="normal" font-style="normal" text-anchor="middle" fill="#1F2D24">Unirse a su área</text>
<text x="400.0" y="271.0" font-family="DejaVu Sans" font-size="12" font-weight="normal" font-style="normal" text-anchor="middle" fill="#1F2D24">con el código del área</text>
<text x="400.0" y="325.5" font-family="DejaVu Sans" font-size="12" font-weight="normal" font-style="normal" text-anchor="middle" fill="#1F2D24">Registrar depósito</text>
<text x="400.0" y="380.0" font-family="DejaVu Sans" font-size="12" font-weight="normal" font-style="normal" text-anchor="middle" fill="#1F2D24">Consultar historial</text>
<text x="400.0" y="395.0" font-family="DejaVu Sans" font-size="12" font-weight="normal" font-style="normal" text-anchor="middle" fill="#1F2D24">de reciclados</text>
<text x="400.0" y="449.5" font-family="DejaVu Sans" font-size="12" font-weight="normal" font-style="normal" text-anchor="middle" fill="#1F2D24">Consultar ranking de áreas</text>
<text x="400.0" y="504.0" font-family="DejaVu Sans" font-size="12" font-weight="normal" font-style="normal" text-anchor="middle" fill="#1F2D24">Consultar misión semanal,</text>
<text x="400.0" y="519.0" font-family="DejaVu Sans" font-size="12" font-weight="normal" font-style="normal" text-anchor="middle" fill="#1F2D24">EcoPuntos e incentivo</text>
<text x="400.0" y="573.5" font-family="DejaVu Sans" font-size="12" font-weight="normal" font-style="normal" text-anchor="middle" fill="#1F2D24">Consultar avisos</text>
<text x="400.0" y="635.5" font-family="DejaVu Sans" font-size="12" font-weight="normal" font-style="normal" text-anchor="middle" fill="#1F2D24">Gestionar Mi cuenta</text>
<text x="730.0" y="194.0" font-family="DejaVu Sans" font-size="12" font-weight="normal" font-style="normal" text-anchor="middle" fill="#1F2D24">Iniciar sesión con</text>
<text x="730.0" y="209.0" font-family="DejaVu Sans" font-size="12" font-weight="normal" font-style="normal" text-anchor="middle" fill="#1F2D24">cuenta externa</text>
<text x="730.0" y="256.0" font-family="DejaVu Sans" font-size="12" font-weight="normal" font-style="normal" text-anchor="middle" fill="#1F2D24">Declarar material</text>
<text x="730.0" y="271.0" font-family="DejaVu Sans" font-size="12" font-weight="normal" font-style="normal" text-anchor="middle" fill="#1F2D24">y talla de bolsa (S–XL)</text>
<text x="730.0" y="318.0" font-family="DejaVu Sans" font-size="12" font-weight="normal" font-style="normal" text-anchor="middle" fill="#1F2D24">Escanear el QR</text>
<text x="730.0" y="333.0" font-family="DejaVu Sans" font-size="12" font-weight="normal" font-style="normal" text-anchor="middle" fill="#1F2D24">del contenedor</text>
<text x="730.0" y="380.0" font-family="DejaVu Sans" font-size="12" font-weight="normal" font-style="normal" text-anchor="middle" fill="#1F2D24">Descargar certificado</text>
<text x="730.0" y="395.0" font-family="DejaVu Sans" font-size="12" font-weight="normal" font-style="normal" text-anchor="middle" fill="#1F2D24">mensual (PDF)</text>
<text x="975.0" y="318.0" font-family="DejaVu Sans" font-size="12" font-weight="normal" font-style="normal" text-anchor="middle" fill="#1F2D24">Escribir el código</text>
<text x="975.0" y="333.0" font-family="DejaVu Sans" font-size="12" font-weight="normal" font-style="normal" text-anchor="middle" fill="#1F2D24">impreso bajo el QR</text>
