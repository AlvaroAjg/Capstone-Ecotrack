<text x="124.0" y="454.0" font-family="DejaVu Sans" font-size="12" font-weight="normal" font-style="normal" text-anchor="end" fill="#1F2D24">Administrador</text>
<text x="124.0" y="469.8" font-family="DejaVu Sans" font-size="12" font-weight="normal" font-style="normal" text-anchor="end" fill="#1F2D24">de planta</text>
