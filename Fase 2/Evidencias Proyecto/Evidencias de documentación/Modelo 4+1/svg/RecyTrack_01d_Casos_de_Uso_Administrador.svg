<text x="910.0" y="617.0" font-family="DejaVu Sans" font-size="11.5" font-weight="normal" font-style="normal" text-anchor="start" fill="#1F2D24">Quien retira el material</text>
<text x="910.0" y="632.2" font-family="DejaVu Sans" font-size="11.5" font-weight="normal" font-style="normal" text-anchor="start" fill="#1F2D24">no usa la app. Se registra:</text>
<text x="910.0" y="647.4" font-family="DejaVu Sans" font-size="11.5" font-weight="normal" font-style="normal" text-anchor="start" fill="#1F2D24">fecha, quién retira, N° de</text>
<text x="910.0" y="662.5" font-family="DejaVu Sans" font-size="11.5" font-weight="normal" font-style="normal" text-anchor="start" fill="#1F2D24">guía, contenedores y peso</text>
<text x="910.0" y="677.7" font-family="DejaVu Sans" font-size="11.5" font-weight="normal" font-style="normal" text-anchor="start" fill="#1F2D24">opcional.</text>
<text x="590.0" y="30.0" font-family="DejaVu Sans" font-size="19" font-weight="bold" font-style="normal" text-anchor="middle" fill="#1F2D24">RecyTrack — Casos de uso del Administrador de planta</text>
